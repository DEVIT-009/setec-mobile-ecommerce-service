  # ---------------------------------------------------------------------------
  # UPLOADS (CLOUDINARY)
  # ---------------------------------------------------------------------------
  /uploads/cloudinary-signature/:
    post:
      summary: Generate signature payload for direct frontend Cloudinary upload
      tags: [Uploads]
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                folder: { type: string, default: "uploads", example: "products" }
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /uploads/confirm/:
    post:
      summary: Confirm uploaded Cloudinary asset and record metadata
      tags: [Uploads]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_id, url]
              properties:
                public_id: { type: string, example: "products/sample_image_123" }
                url: { type: string, format: uri, example: "https://res.cloudinary.com/demo/image/upload/sample.jpg" }
                secure_url: { type: string, format: uri, example: "https://res.cloudinary.com/demo/image/upload/sample.jpg" }
                mime_type: { type: string, example: "image/jpeg" }
                usage_type: { type: string, example: "product_image" }
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

# ---------------------------------------------------------------------------
# COMPONENTS & SCHEMAS
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessEnvelope:
      type: object
      properties:
        data:
          type: object
          description: Response payload
        meta:
          type: object
          properties:
            request_id: { type: string, nullable: true }
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'

    ListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          type: object
          properties:
            page: { type: integer, example: 1 }
            page_size: { type: integer, example: 20 }
            total: { type: integer, example: 50 }
            has_next: { type: boolean, example: true }
            request_id: { type: string, nullable: true }
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'

    ApiError:
      type: object
      properties:
        code: { type: string, example: "VALIDATION_ERROR" }
        message: { type: string, example: "Invalid input provided" }
        field: { type: string, nullable: true, example: "email" }
